<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>온라인 연결 테스트</title>
<style>
:root{--bg:#1d1a3c;--panel:#2a62d4;--panel2:#1f4fb3;--ink:#fff;--dark:#14122a;--gold:#f5c518;--ok:#7dff9a;--bad:#ff8fa0;--muted:#dfe6ff;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;padding:16px max(16px,env(safe-area-inset-right)) 24px max(16px,env(safe-area-inset-left))}
main{max-width:680px;margin:0 auto;display:grid;gap:14px}
h1{margin:0;font-size:22px;background:var(--panel2);border:3px solid var(--dark);border-radius:10px;padding:10px 14px}
.card{background:var(--panel);border:3px solid var(--dark);border-radius:10px;padding:14px;display:grid;gap:10px;box-shadow:0 4px 0 var(--dark)}
.card h2{margin:0;font-size:17px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{appearance:none;cursor:pointer;font:inherit;font-weight:700;font-size:15px;color:var(--dark);background:var(--gold);border:3px solid var(--dark);border-radius:8px;padding:8px 12px;box-shadow:0 3px 0 var(--dark);min-height:42px}
button.alt{background:#3a3f5c;color:#fff}
button:disabled{opacity:.45;cursor:default}
input{font:inherit;font-size:16px;color:var(--dark);background:#fff;border:3px solid var(--dark);border-radius:8px;padding:8px;min-width:0}
.status{font-weight:700;background:var(--dark);border-radius:8px;padding:10px 12px;font-size:15px;line-height:1.5}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.help{margin:0;font-size:13px;color:var(--muted);line-height:1.5}
.list{display:grid;gap:6px}
.item{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--panel2);border:3px solid var(--dark);border-radius:8px;padding:8px 10px}
.item small{opacity:.85}
.code{font-family:ui-monospace,Menlo,monospace;letter-spacing:1px}
#log{background:var(--dark);border-radius:8px;padding:8px 10px;min-height:70px;max-height:200px;overflow:auto;font-size:14px;display:grid;gap:4px;align-content:start}
#log p,.log2 p{margin:0;word-break:break-word}
.log2{background:var(--dark);border-radius:8px;padding:8px 10px;min-height:70px;max-height:220px;overflow:auto;font-size:14px;display:grid;gap:4px;align-content:start}
.log2 small{opacity:.7}
#inviteBox{position:fixed;inset:0;display:grid;place-items:center;background:rgba(10,8,30,.6);padding:16px;z-index:10}
#inviteBox .card{width:min(360px,100%)}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <h1>온라인 연결 테스트</h1>
  <p class="help">로그인 없이 친구 코드로 접속자를 보고, 초대하고, 같은 방에서 직접 연결(WebRTC)되는지 확인하는 페이지예요.</p>
  <div class="status" id="status">Firebase에 연결하는 중…</div>

  <div class="card">
    <h2>내 정보</h2>
    <div class="row">친구 코드 <b class="code" id="myCode">-</b></div>
    <div class="row"><input id="nickIn" maxlength="12" placeholder="닉네임 (1~12자)" aria-label="닉네임"><button id="nickSave">닉네임 저장</button></div>
  </div>

  <div class="card">
    <h2>친구</h2>
    <div class="row"><input id="friendIn" maxlength="8" placeholder="친구 코드" aria-label="친구 코드" style="text-transform:uppercase"><button id="friendAdd">친구 추가</button></div>
    <div class="list" id="friendList"></div>
  </div>

  <div class="card">
    <h2>현재 접속자 (<span id="onCount">0</span>)</h2>
    <div class="list" id="onList"></div>
  </div>

  <div class="card">
    <h2>전체 채팅</h2>
    <p class="help">접속한 모든 사람과 채팅해요. 메시지는 3일이 지나면 지워져요.</p>
    <div id="chatLog" class="log2"></div>
    <div class="row"><input id="chatIn" maxlength="200" placeholder="메시지" style="flex:1"><button id="chatSend">보내기</button></div>
  </div>

  <div class="card">
    <h2>내 방</h2>
    <div class="row"><button id="roomCreate">방 만들기</button><button class="alt" id="roomLeave" disabled>방 나가기</button></div>
    <div class="list" id="memberList"></div>
    <div id="log" aria-live="polite"></div>
    <div class="row"><input id="msg" placeholder="메시지" style="flex:1"><button id="send" disabled>보내기</button><button class="alt" id="ping" disabled>지연 시간</button></div>
  </div>
</main>

<div id="inviteBox" hidden role="dialog" aria-modal="true" aria-labelledby="invT"><div class="card">
  <h2 id="invT">초대가 왔어요</h2>
  <p class="help" id="invText"></p>
  <div class="row"><button id="invYes">수락</button><button class="alt" id="invNo">거절</button></div>
</div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getDatabase, ref, set, get, update, remove, onValue, onChildAdded, onDisconnect, push, serverTimestamp, runTransaction, query, orderByChild, startAt, endAt, limitToLast, limitToFirst } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBWaAux4CAp2vmRpObC7sVrF5j6ZDoPNis",
  authDomain: "brawl090417.firebaseapp.com",
  databaseURL: "https://brawl090417-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "brawl090417",
  storageBucket: "brawl090417.firebasestorage.app",
  messagingSenderId: "327147279662",
  appId: "1:327147279662:web:6dcfba7867660b632a56bf"
};
const ICE = { iceServers: [{ urls: ["stun:stun.l.google.com:19302", "stun:stun1.l.google.com:19302"] }] };

const $ = id => document.getElementById(id);
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

let me = null, myCode = null, presence = {}, roomId = null, hostUid = null, isHost = false;
const peers = {};      // uid -> {pc, dc, pend:[] , nick}
const unsubs = [];     // room listeners
let pendingInvite = null;

const ls = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } },
             set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} } };
const nick = () => (ls.get('bs_nick') || '').trim();
const friends = () => { try { return JSON.parse(ls.get('bs_friends') || '[]'); } catch (e) { return []; } };
function status(html) { $('status').innerHTML = html; }
function log(t) { const p = document.createElement('p'); p.textContent = t; $('log').append(p); $('log').scrollTop = $('log').scrollHeight; }
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* ---------- 로그인(익명) · 친구 코드 · 접속 표시 ---------- */
onAuthStateChanged(auth, async user => {
  if (!user) return;
  me = user.uid;
  try {
    myCode = await claimCode();
    $('myCode').textContent = myCode;
    $('nickIn').value = nick();
    await goOnline();
    listenPresence();
    listenInvites();
    startChat();
    status('<span class="ok">연결됐어요.</span> 다른 기기에서도 이 페이지를 열어 보세요.');
  } catch (e) {
    status('<span class="bad">준비 중 오류:</span> ' + esc(e && e.message || e) + '<br>Firebase 보안 규칙을 붙여넣었는지 확인해 주세요.');
  }
});
signInAnonymously(auth).catch(e => status('<span class="bad">익명 로그인 실패:</span> ' + esc(e.code || e.message) + '<br>Firebase 콘솔에서 익명 로그인을 켰는지 확인해 주세요.'));

function newCode() { const A = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'; return Array.from({ length: 6 }, () => A[Math.floor(Math.random() * A.length)]).join(''); }
async function claimCode() {
  let code = ls.get('bs_code');
  for (let i = 0; i < 6; i++) {
    if (!code) code = newCode();
    const r = await runTransaction(ref(db, 'codes/' + code), cur => (cur === null || cur === me) ? me : undefined);
    if (r.committed && r.snapshot.val() === me) { ls.set('bs_code', code); return code; }
    code = null; // 다른 사람이 쓰는 코드 → 새로 만들기
  }
  throw new Error('친구 코드를 만들지 못했어요');
}
async function goOnline() {
  const pref = ref(db, 'presence/' + me);
  onValue(ref(db, '.info/connected'), async s => {
    if (s.val() !== true) return;
    await onDisconnect(pref).remove();
    await set(pref, { code: myCode, nick: nick() || '닉네임 없음', st: roomId ? '방' : '메뉴', t: serverTimestamp() });
  });
}
function updatePresence() {
  if (!me) return;
  set(ref(db, 'presence/' + me), { code: myCode, nick: nick() || '닉네임 없음', st: roomId ? '방' : '메뉴', t: serverTimestamp() });
}
$('nickSave').addEventListener('click', () => {
  const v = $('nickIn').value.trim();
  if (!v) { status('<span class="bad">닉네임을 입력해 주세요.</span>'); return; }
  ls.set('bs_nick', v.slice(0, 12)); updatePresence(); status('<span class="ok">닉네임을 저장했어요.</span>');
});

function listenPresence() {
  onValue(ref(db, 'presence'), s => { presence = s.val() || {}; renderOnline(); renderFriends(); });
}
function uidByCode(code) { for (const u in presence) if (presence[u].code === code) return u; return null; }
function inviteBtn(uid) {
  const b = document.createElement('button'); b.textContent = '초대';
  b.addEventListener('click', () => sendInvite(uid));
  return b;
}
function renderOnline() {
  const list = $('onList'); list.textContent = '';
  const uids = Object.keys(presence);
  $('onCount').textContent = uids.length;
  for (const u of uids) {
    const p = presence[u], row = document.createElement('div'); row.className = 'item';
    const t = document.createElement('span'); t.innerHTML = '<b>' + esc(p.nick) + '</b> <small class="code">' + esc(p.code) + '</small> <small>· ' + (u === me ? '나 · ' : '') + esc(p.st || '메뉴') + '</small>';
    row.append(t); if (u !== me) row.append(inviteBtn(u));
    list.append(row);
  }
}
function renderFriends() {
  const list = $('friendList'); list.textContent = '';
  const fs = friends();
  if (!fs.length) { const p = document.createElement('p'); p.className = 'help'; p.textContent = '아직 친구가 없어요. 친구 코드를 서로 등록해 보세요.'; list.append(p); return; }
  for (const c of fs) {
    const u = uidByCode(c), row = document.createElement('div'); row.className = 'item';
    const t = document.createElement('span');
    t.innerHTML = (u ? '<b>' + esc(presence[u].nick) + '</b>' : '<b>(오프라인)</b>') + ' <small class="code">' + esc(c) + '</small> ' + (u ? '<small class="ok">접속 중</small>' : '<small>오프라인</small>');
    row.append(t); if (u && u !== me) row.append(inviteBtn(u));
    list.append(row);
  }
}
$('friendAdd').addEventListener('click', () => {
  const c = $('friendIn').value.trim().toUpperCase();
  if (!/^[A-Z0-9]{6}$/.test(c)) { status('<span class="bad">친구 코드 6자리를 입력해 주세요.</span>'); return; }
  if (c === myCode) { status('<span class="bad">내 코드예요.</span>'); return; }
  const fs = friends(); if (!fs.includes(c)) fs.push(c); ls.set('bs_friends', JSON.stringify(fs));
  $('friendIn').value = ''; renderFriends(); status('<span class="ok">친구를 추가했어요.</span>');
});

/* ---------- 초대 ---------- */
async function sendInvite(uid) {
  if (!roomId) await createRoom();
  if (!isHost) { status('<span class="bad">방장만 초대할 수 있어요.</span>'); return; }
  await push(ref(db, 'invites/' + uid), { from: me, fromNick: nick() || '닉네임 없음', room: roomId, t: serverTimestamp() });
  status('<span class="ok">초대를 보냈어요.</span>');
}
function listenInvites() {
  onChildAdded(ref(db, 'invites/' + me), s => {
    const v = s.val() || {};
    pendingInvite = { key: s.key, ...v };
    $('invText').textContent = (v.fromNick || '누군가') + '님이 방에 초대했어요.';
    $('inviteBox').hidden = false;
  });
}
$('invNo').addEventListener('click', async () => {
  if (pendingInvite) await remove(ref(db, 'invites/' + me + '/' + pendingInvite.key));
  pendingInvite = null; $('inviteBox').hidden = true;
});
$('invYes').addEventListener('click', async () => {
  const inv = pendingInvite; pendingInvite = null; $('inviteBox').hidden = true;
  if (!inv) return;
  await remove(ref(db, 'invites/' + me + '/' + inv.key));
  await leaveRoom();
  await joinRoom(inv.room).catch(e => status('<span class="bad">방에 들어가지 못했어요:</span> ' + esc(e.message)));
});

/* ---------- 전체 채팅 (모든 접속자 · 3일 지나면 삭제) ---------- */
const CHAT_KEEP = 3 * 24 * 60 * 60 * 1000;
let chatStarted = false;
function startChat() {
  if (chatStarted) return; chatStarted = true;
  const since = Date.now() - CHAT_KEEP;
  onChildAdded(query(ref(db, 'chat'), orderByChild('t'), startAt(since), limitToLast(100)), s => addChat(s.val()));
  // 3일 지난 메시지 정리 (누구나 지울 수 있게 규칙에서 허용)
  get(query(ref(db, 'chat'), orderByChild('t'), endAt(since), limitToFirst(100))).then(snap => {
    snap.forEach(c => { remove(c.ref).catch(() => {}); });
  }).catch(() => {});
}
function addChat(m) {
  if (!m || typeof m.text !== 'string') return;
  const box = $('chatLog'), p = document.createElement('p');
  const d = new Date(m.t || Date.now());
  const time = (d.getMonth() + 1) + '/' + d.getDate() + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  const b = document.createElement('b'); b.textContent = String(m.nick || '???').slice(0, 12) + (m.from === me ? ' (나)' : '');
  const sm = document.createElement('small'); sm.textContent = ' ' + time;
  const t = document.createElement('span'); t.textContent = ' ' + m.text.slice(0, 200);
  p.append(b, sm, t); box.append(p); box.scrollTop = box.scrollHeight;
}
$('chatSend').addEventListener('click', async () => {
  const v = $('chatIn').value.trim();
  if (!nick()) { status('<span class="bad">채팅하려면 먼저 닉네임을 정해 주세요.</span>'); $('nickIn').focus(); return; }
  if (!v || !me) return;
  try { await push(ref(db, 'chat'), { from: me, nick: nick(), text: v.slice(0, 200), t: serverTimestamp() }); $('chatIn').value = ''; }
  catch (e) { status('<span class="bad">채팅을 보내지 못했어요:</span> ' + esc(e.message)); }
});
$('chatIn').addEventListener('keydown', e => { if (e.key === 'Enter') $('chatSend').click(); });

/* ---------- 방 · WebRTC (방장 중심 연결 · 방장 위임) ---------- */
let roomUnsub = null, lastMembers = {}, armedFor = '';
async function createRoom() {
  await leaveRoom();
  const r = push(ref(db, 'rooms'));
  await set(r, { host: me, t: serverTimestamp(), members: { [me]: { nick: nick() || '닉네임 없음', j: serverTimestamp() } } });
  await enterRoom(r.key, true);
  log('방을 만들었어요. 친구를 초대해 보세요.');
}
async function joinRoom(id) {
  const mref = ref(db, 'rooms/' + id + '/members/' + me);
  await set(mref, { nick: nick() || '닉네임 없음', j: serverTimestamp() });
  await onDisconnect(mref).remove();
  await enterRoom(id);
  log('방에 들어왔어요. 방장과 연결하는 중…');
}
async function enterRoom(id, asHost) {
  roomId = id; hostUid = asHost ? me : null; isHost = !!asHost; lastMembers = {}; armedFor = '';
  roomUnsub = onValue(ref(db, 'rooms/' + id), s => onRoom(id, s));
  roomUI(); updatePresence();
}
function successor(m) {
  let best = null;
  for (const u in m) if (u !== me && (!best || (m[u].j || 0) < (m[best].j || 0))) best = u;
  return best;
}
async function armHostDisconnect(m) {
  const rref = ref(db, 'rooms/' + roomId);
  await onDisconnect(rref).cancel();
  const next = successor(m);
  if (next) {
    await onDisconnect(ref(db, 'rooms/' + roomId + '/host')).set(next);
    await onDisconnect(ref(db, 'rooms/' + roomId + '/members/' + me)).remove();
  } else {
    await onDisconnect(rref).remove();
  }
}
function onRoom(id, s) {
  if (id !== roomId) return;
  if (!s.exists()) { log('방이 닫혔어요.'); leaveRoom(true); return; }
  const v = s.val() || {}, m = v.members || {};
  lastMembers = m;
  if (!m[me]) { log('방에서 나와졌어요.'); leaveRoom(true); return; }
  if (v.host !== hostUid) {
    const prev = hostUid;
    hostUid = v.host; isHost = hostUid === me;
    for (const u in peers) closePeer(u);
    if (prev) log((m[hostUid] ? m[hostUid].nick : '?') + '님이 새 방장이 됐어요.');
    if (!isHost) guestConnect(hostUid);
    armedFor = '';
  }
  if (isHost) {
    for (const u in m) if (u !== me && !peers[u]) hostConnect(u, m[u].nick);
    for (const u in peers) if (!m[u]) closePeer(u);
    const key = Object.keys(m).sort().join(',');
    if (key !== armedFor) { armedFor = key; armHostDisconnect(m).catch(() => {}); }
  }
  renderMembers(m);
}
async function leaveRoom(already) {
  if (!roomId) return;
  const id = roomId, wasHost = isHost, m = lastMembers;
  if (roomUnsub) { roomUnsub(); roomUnsub = null; }
  for (const u in peers) closePeer(u);
  roomId = null; hostUid = null; isHost = false; armedFor = '';
  if (!already) {
    try {
      const rref = ref(db, 'rooms/' + id);
      await onDisconnect(rref).cancel();
      if (wasHost) {
        const next = successor(m);
        if (next) await update(rref, { host: next, ['members/' + me]: null });
        else await remove(rref);
      } else {
        await remove(ref(db, 'rooms/' + id + '/members/' + me));
      }
    } catch (e) {}
  }
  try { await remove(ref(db, 'signal/' + id + '/' + me)); } catch (e) {}
  $('memberList').textContent = ''; roomUI(); updatePresence();
}
function roomUI() {
  const inRoom = !!roomId;
  $('roomLeave').disabled = !inRoom; $('roomCreate').disabled = inRoom;
  const open = Object.values(peers).some(p => p.dc && p.dc.readyState === 'open');
  $('send').disabled = $('ping').disabled = !open;
}
function renderMembers(m) {
  const list = $('memberList'); list.textContent = '';
  for (const u in m) {
    const row = document.createElement('div'); row.className = 'item';
    const p = peers[u], open = p && p.dc && p.dc.readyState === 'open';
    const role = u === hostUid ? '방장' : '';
    const st = u === me ? (role ? '나 · 방장' : '나') : (role ? role + ' · ' : '') + (open ? '<span class="ok">연결됨</span>' : (isHost || u === hostUid) ? '연결 중…' : '');
    row.innerHTML = '<b>' + esc(m[u].nick) + '</b><small>' + st + '</small>';
    list.append(row);
  }
}
function newPeer(uid, nickName) {
  const pc = new RTCPeerConnection(ICE);
  peers[uid] = { pc, dc: null, pend: [], nick: nickName || '?', subs: [] };
  pc.addEventListener('connectionstatechange', () => {
    if (pc.connectionState === 'failed') log((peers[uid] && peers[uid].nick || '상대') + '님과 연결에 실패했어요 (네트워크 문제일 수 있어요).');
  });
  return pc;
}
function sub(uid, unsub) { if (peers[uid]) peers[uid].subs.push(unsub); else unsub(); }
async function addCand(uid, c) {
  const p = peers[uid]; if (!p || !c) return;
  if (p.pc.remoteDescription) { try { await p.pc.addIceCandidate(c); } catch (e) {} } else p.pend.push(c);
}
async function flushCands(uid) { const p = peers[uid]; if (!p) return; for (const c of p.pend.splice(0)) { try { await p.pc.addIceCandidate(c); } catch (e) {} } }
function wireDC(uid, dc) {
  if (!peers[uid]) return;
  peers[uid].dc = dc;
  dc.addEventListener('open', () => { log((peers[uid] && peers[uid].nick || '상대') + '님과 직접 연결됐어요.'); roomUI(); renderMembers(lastMembers); });
  dc.addEventListener('close', () => { roomUI(); renderMembers(lastMembers); });
  dc.addEventListener('message', e => {
    let m; try { m = JSON.parse(e.data); } catch (err) { return; }
    if (m.t === 'ping') dc.send(JSON.stringify({ t: 'pong', s: m.s }));
    else if (m.t === 'pong') log('지연 시간: ' + Math.round(performance.now() - m.s) + 'ms (왕복)');
    else if (m.t === 'msg' && typeof m.v === 'string') {
      const who = String(m.n || (peers[uid] && peers[uid].nick) || '?').slice(0, 12), text = m.v.slice(0, 200);
      log(who + ': ' + text);
      if (isHost) for (const u in peers) if (u !== uid && peers[u].dc && peers[u].dc.readyState === 'open') peers[u].dc.send(JSON.stringify({ t: 'msg', n: who, v: text }));
    }
  });
}
async function hostConnect(uid, nickName) {
  const id = roomId, base = 'signal/' + id + '/';
  const pc = newPeer(uid, nickName);
  await remove(ref(db, base + me + '/' + uid)).catch(() => {});
  if (!peers[uid] || peers[uid].pc !== pc) return;
  wireDC(uid, pc.createDataChannel('game', { ordered: true }));
  pc.onicecandidate = e => { if (e.candidate) push(ref(db, base + me + '/' + uid + '/cand'), e.candidate.toJSON()); };
  sub(uid, onValue(ref(db, base + uid + '/' + me + '/answer'), async s => {
    const a = s.val(); if (!a || pc.remoteDescription || pc.signalingState !== 'have-local-offer') return;
    await pc.setRemoteDescription(a); flushCands(uid);
  }));
  sub(uid, onChildAdded(ref(db, base + uid + '/' + me + '/cand'), s => addCand(uid, s.val())));
  await pc.setLocalDescription(await pc.createOffer());
  await set(ref(db, base + me + '/' + uid + '/offer'), { type: 'offer', sdp: pc.localDescription.sdp, k: Date.now() });
}
async function guestConnect(host) {
  const id = roomId, base = 'signal/' + id + '/';
  const pc = newPeer(host, (presence[host] && presence[host].nick) || '방장');
  await remove(ref(db, base + me + '/' + host)).catch(() => {});
  if (!peers[host] || peers[host].pc !== pc) return;
  pc.ondatachannel = e => wireDC(host, e.channel);
  pc.onicecandidate = e => { if (e.candidate) push(ref(db, base + me + '/' + host + '/cand'), e.candidate.toJSON()); };
  sub(host, onValue(ref(db, base + host + '/' + me + '/offer'), async s => {
    const o = s.val(); if (!o || pc.remoteDescription) return;
    await pc.setRemoteDescription({ type: 'offer', sdp: o.sdp }); flushCands(host);
    await pc.setLocalDescription(await pc.createAnswer());
    await set(ref(db, base + me + '/' + host + '/answer'), { type: 'answer', sdp: pc.localDescription.sdp });
  }));
  sub(host, onChildAdded(ref(db, base + host + '/' + me + '/cand'), s => addCand(host, s.val())));
}
function closePeer(uid) {
  const p = peers[uid]; if (!p) return;
  for (const u of p.subs) { try { u(); } catch (e) {} }
  try { p.dc && p.dc.close(); p.pc.close(); } catch (e) {}
  delete peers[uid]; roomUI();
}

$('roomCreate').addEventListener('click', () => createRoom().catch(e => status('<span class="bad">방을 만들지 못했어요:</span> ' + esc(e.message))));
$('roomLeave').addEventListener('click', () => { leaveRoom(); log('방에서 나왔어요.'); });
$('send').addEventListener('click', () => {
  const v = $('msg').value.trim(); if (!v) return;
  const data = JSON.stringify({ t: 'msg', n: nick() || '닉네임 없음', v });
  for (const u in peers) if (peers[u].dc && peers[u].dc.readyState === 'open') peers[u].dc.send(data);
  log('나: ' + v); $('msg').value = '';
});
$('msg').addEventListener('keydown', e => { if (e.key === 'Enter') $('send').click(); });
$('ping').addEventListener('click', () => { for (const u in peers) if (peers[u].dc && peers[u].dc.readyState === 'open') peers[u].dc.send(JSON.stringify({ t: 'ping', s: performance.now() })); });
addEventListener('pagehide', () => { leaveRoom(); });
